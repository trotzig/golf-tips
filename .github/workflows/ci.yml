# CI is paused for now to keep PR throughput high early on. Run the same checks locally before
# opening a PR: pnpm lint && pnpm typecheck && pnpm test && pnpm build
# The deploy workflow still runs `pnpm build`, so invalid content blocks a deploy.
# To re-enable, restore these triggers above workflow_dispatch:
#   pull_request:
#   push:
#     branches: [main]
name: CI

on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm validate
      - run: pnpm build
